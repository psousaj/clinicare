# Infra de desenvolvimento: PostgreSQL, API e R2 local; a web roda no host com `bun run dev:web`.
name: clinicare-dev
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicare
      POSTGRES_USER: clinicare
      POSTGRES_PASSWORD: clinicare
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicare -d clinicare"]
      interval: 5s
      timeout: 5s
      retries: 15
  # Emulador AWS local (S3 compatível, substitui o R2 em dev): http://localhost:4566
  ministack:
    image: ministackorg/ministack
    restart: unless-stopped
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    volumes:
      - ministack-data:/tmp/ministack
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 15
  # Cria os buckets separados de dev e de testes e encerra
  ministack-init:
    image: curlimages/curl:latest
    environment:
      MINISTACK_BUCKET: ${MINISTACK_BUCKET:-clinicare-dev}
      MINISTACK_TEST_BUCKET: ${MINISTACK_TEST_BUCKET:-clinicare-test}
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for bucket in "$${MINISTACK_BUCKET}" "$${MINISTACK_TEST_BUCKET}"; do
          ready=false
          for i in $$(seq 1 30); do
            if curl -sf -X PUT "http://ministack:4566/$${bucket}"; then
              echo "bucket $${bucket} pronto"
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$${ready}" != "true" ]; then
            echo "falha ao criar bucket $${bucket}" >&2
            exit 1
          fi
        done
volumes:
  postgres-data:
    name: clinicare-dev_postgres-data
  ministack-data:
