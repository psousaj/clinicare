services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://clinicare:clinicare@postgres:5432/clinicare
      MONGODB_URI: mongodb://mongo:27017/clinicare
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicare
      POSTGRES_USER: clinicare
      POSTGRES_PASSWORD: clinicare
    ports:
      - "5432:5432"
    volumes:
      - clinicare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicare -d clinicare"]
      interval: 5s
      timeout: 5s
      retries: 15
  # Transitional legacy store: existing API routes still use Mongoose until their domain tickets migrate.
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - clinicare-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  clinicare-postgres:
  clinicare-mongo:
